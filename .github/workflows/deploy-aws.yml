# =============================================================================
# GitHub Actions - Auto Deploy to AWS EC2
# =============================================================================
name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ EC2_HOST secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ EC2_SSH_KEY secret is not set!"
            exit 1
          fi
          echo "✅ Required secrets are set"
      
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: ALPACA_API_KEY,ALPACA_SECRET_KEY,GEMINI_API_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY,ALPHA_VANTAGE_API_KEY,APP_USERNAME,APP_PASSWORD,GITHUB_REPO
          script: |
            echo "🚀 Starting deployment at $(date)"
            
            APP_DIR="$HOME/mini-fund-tool"
            
            # 1. Clone or pull repo
            if [ ! -d "$APP_DIR" ]; then
              echo "📦 First-time setup: Cloning repository..."
              cd $HOME
              git clone https://github.com/${GITHUB_REPO}.git mini-fund-tool
            else
              echo "📥 Pulling latest code..."
              cd $APP_DIR
              git fetch origin main
              git reset --hard origin/main
            fi
            
            cd $APP_DIR
            
            # 2. Setup Python environment
            echo "🐍 Setting up Python environment..."
            
            # Install Python 3.11 if not available
            if ! command -v python3 &> /dev/null; then
              echo "Installing Python..."
              sudo apt-get update -qq
              sudo apt-get install -y python3 python3-venv python3-pip -qq
            fi
            
            # Create venv if needed
            if [ ! -d ".venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv .venv
            fi
            
            # Install dependencies
            source .venv/bin/activate
            echo "📦 Installing dependencies..."
            pip install --upgrade pip -q
            pip install -r requirements.txt -q
            
            # 3. Create .env file
            echo "🔐 Creating .env file..."
            cat > .env << EOF
            ALPACA_API_KEY=${ALPACA_API_KEY}
            ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
            APP_USERNAME=${APP_USERNAME:-admin}
            APP_PASSWORD=${APP_PASSWORD}
            EOF
            
            # 4. Create systemd service
            echo "⚙️ Setting up systemd service..."
            
            cat > /tmp/quantfund.service << EOF
            [Unit]
            Description=Mini Quant Fund Trading Bot
            After=network.target
            
            [Service]
            Type=simple
            User=$USER
            WorkingDirectory=$APP_DIR
            Environment=PATH=$APP_DIR/.venv/bin:/usr/local/bin:/usr/bin
            EnvironmentFile=$APP_DIR/.env
            ExecStart=$APP_DIR/.venv/bin/python app.py
            Restart=always
            RestartSec=10
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            sudo mv /tmp/quantfund.service /etc/systemd/system/quantfund.service
            sudo systemctl daemon-reload
            sudo systemctl enable quantfund
            
            # 5. Restart service
            echo "🔄 Restarting service..."
            sudo systemctl restart quantfund
            
            sleep 8
            
            # 6. Health check
            if sudo systemctl is-active --quiet quantfund; then
              echo "✅ Service is running!"
              echo "🌐 App available at http://$(curl -s ifconfig.me):5000"
            else
              echo "❌ Service failed!"
              sudo journalctl -u quantfund -n 30 --no-pager
              exit 1
            fi
      
      - name: Deployment Result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployed to http://${{ secrets.EC2_HOST }}:5000"
          else
            echo "❌ Deployment failed"
          fi
